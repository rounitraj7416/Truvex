<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRUVEX — Sign In</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="neural-canvas"></canvas>

  <header>
    <div class="nav-container">
      <a href="/" class="brand-link">
        <div class="brand-shield">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span class="brand-name">TRUVEX</span>
      </a>
      <ul class="nav-menu">
        <li><a href="/" class="nav-link">&larr; Back to Home</a></li>
      </ul>
    </div>
  </header>

  <main class="main-wrapper" style="display: flex; align-items: center; justify-content: center; min-height: 75vh;">
    <div class="card-elevated" style="max-width: 440px; width: 100%; padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.6rem; font-weight: 700; color: #FFFFFF; letter-spacing: -0.02em;">Sign In to TRUVEX</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.35rem;">
          Access your enterprise workspace or administration portal.
        </p>
      </div>

      <div id="login-error" style="display: none; background: var(--status-rose-dim); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--status-rose); padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Work Email</label>
          <input type="email" id="email" class="form-input" required placeholder="name@company.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" required placeholder="••••••••" autocomplete="current-password" />
        </div>

        <button type="submit" id="submit-btn" class="btn-primary" style="width: 100%; margin-top: 0.75rem;">
          Sign In
        </button>
      </form>

      <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center;">
        <p style="color: var(--text-muted); font-size: 0.825rem;">
          New organization? <a href="/enterprise#register" style="color: var(--accent-teal); text-decoration: none; font-weight: 600;">Register Enterprise</a>
        </p>
      </div>
    </div>
  </main>

  <script src="/static/js/neural-canvas.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passInput = document.getElementById("password");
    const errBox = document.getElementById("login-error");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Authenticating...";

      try {
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: emailInput.value.trim(),
            password: passInput.value
          })
        });

        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.detail || "Authentication failed. Please verify your credentials.");
        }

        // Save token and profile in localStorage
        localStorage.setItem("truvex_token", data.access_token);
        localStorage.setItem("truvex_user", JSON.stringify(data.user));

        // Automatic Role-Based Redirection
        if (data.user.role === "superadmin") {
          window.location.href = "/admin";
        } else if (data.user.role === "enterprise_admin") {
          window.location.href = "/enterprise";
        } else {
          window.location.href = "/employee";
        }
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
