# Render Blueprint — TRUVEX Platform
# https://docs.render.com/blueprint-spec

services:
  - type: web
    name: truvex-platform
    runtime: docker
    repo: https://github.com/rounitraj7416/Truvex.git
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: truvex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DETECTIF_API_KEY
        sync: false  # Must be set manually
      - key: DETECTIF_MOCK_FALLBACK
        value: "True"
      - key: ENABLE_LIVE_SANDBOX
        value: "False"
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production

databases:
  - name: truvex-db
    plan: free
    databaseName: truvex
    user: truvex_user
