name: TRUVEX CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DETECTIF_MOCK_FALLBACK: "True"
      DETECTIF_API_KEY: ""
      ENABLE_LIVE_SANDBOX: "False"
      DATABASE_URL: "sqlite:///./truvex_ci.db"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest backend/tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t truvex-platform:ci .
